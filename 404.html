<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Your Learning Scientist</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      color: #0f172a;
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 480px; }
    .code {
      font-family: 'Lora', serif;
      font-size: 5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 { font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    p { color: #475569; line-height: 1.6; margin-bottom: 28px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: 0 8px 24px -8px rgba(30, 58, 138, 0.5);
      transition: transform 0.2s;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>That page is off the curriculum.</h1>
    <p>The link you followed doesn't lead anywhere — but there's plenty of good stuff to explore from the homepage.</p>
    <a href="/">← Back to Your Learning Scientist</a>
  </div>
</body>
</html>
